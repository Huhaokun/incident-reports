 WAF重启。<\/p>\n<p>学习价值：按SOP执行也能出事故；规则是代码，需要成本上界、性能门和渐进发布。<\/p>"}, {"id": "google-2019-06-02-network-config-blast-radius", "date": "2019-06-02", "dateSort": "2019-06-02", "dateUnknown": false, "company": "Google Cloud", "title": "An update on Sunday’s service disruption", "kind": "事故复盘", "url": "https://cloud.google.com/blog/topics/inside-google-cloud/an-update-on-sundays-service-disruption", "completeness": "低", "impact": "受影响区域停止使用超过一半可用网络容量，出现拥塞；系统丢弃更大、对延迟不敏感的流量。 波及 YouTube、GCS、Gmail、GCP 等，严重程度不一。 用户数/错误率精确数字：报告未量化。", "root": "配置变更被 错误扩大 到相邻多个区域、更大规模服务器集合。 这些区域停止使用超过一半可用网络容量 → 拥塞。", "analysisHtml": "<h1>An update on Sunday’s service disruption<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li><strong>公司<\/strong>: Google / Google Cloud<\/li>\n<li><strong>标题<\/strong>: An update on Sunday’s service disruption<\/li>\n<li><strong>日期<\/strong>: 2019-06-02（事故当日为前一个周日；复盘文 2019-06-03）<\/li>\n<li><strong>URL<\/strong>: https://cloud.google.com/blog/topics/inside-google-cloud/an-update-on-sundays-service-disruption<\/li>\n<li><strong>原文路径<\/strong>: <code>raw/google-2019-06-02-network-config-blast-radius.md<\/code><\/li>\n<li><strong>严重度 / 时长<\/strong>: 多产品不同程度受影响；检测数秒，纠正远超「数分钟」目标。精确时长/%：<strong>报告未量化<\/strong><\/li>\n<li><strong>原文完整度<\/strong>: 低（早期更新文；机制与放大器清楚，改进仅方向性，缺时间线细节与 SOP）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<ul>\n<li>受影响区域停止使用超过一半可用网络容量，出现拥塞；系统丢弃更大、对延迟不敏感的流量。<\/li>\n<li>波及 YouTube、GCS、Gmail、GCP 等，严重程度不一。<\/li>\n<li>用户数/错误率精确数字：<strong>报告未量化<\/strong>。<\/li>\n<\/ul>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>一次意图只作用于 <strong>单一区域内少量服务器<\/strong> 的网络配置变更。<\/p>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因（Proximate）<\/h3>\n<ul>\n<li>配置变更被 <strong>错误扩大<\/strong> 到相邻多个区域、更大规模服务器集合。<\/li>\n<li>这些区域停止使用超过一半可用网络容量 → 拥塞。<\/li>\n<\/ul>\n<h3>3.2 促成因素（Contributing）<\/h3>\n<ul>\n<li>网络容量是多产品共用底层依赖。<\/li>\n<li>检测虽快，但诊断与纠正被同一轮拥塞拖慢——修复通道与故障面耦合。<\/li>\n<\/ul>\n<h3>3.3 为何防护没挡住 / 为何潜伏<\/h3>\n<ul>\n<li>变更作用域控制失败（意图范围 ≠ 实际生效范围）。<\/li>\n<li>报告未说明为何作用域校验未拦住扩大应用。<\/li>\n<\/ul>\n<h3>3.4 证据与未知<\/h3>\n<ul>\n<li>证据：意图范围 vs 实际范围、容量腰斩、检测秒级、纠正远超数分钟目标、多产品影响。<\/li>\n<li>未知：具体配置系统名、完整时间线、详细 corrective actions、SOP 文本。<\/li>\n<\/ul>\n<h2>4. 检测（Detection）<\/h2>\n<ul>\n<li>检测在 <strong>数秒内<\/strong> 完成。<\/li>\n<li>具体告警系统名称、是否客户先报：<strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<ul>\n<li><strong>临时止血 / 恢复<\/strong>: 恢复正确配置；纠正过程被同一轮网络拥塞拖慢。<\/li>\n<li><strong>永久修复<\/strong>: 原文仅写将做 thorough postmortem 与工程冲刺，防范同类问题——具体条目 <strong>报告未列出<\/strong>。<\/li>\n<\/ul>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<ul>\n<li>变更作用域失控 → 多区域容量腰斩。<\/li>\n<li>拥塞拖慢配置恢复通道，MTTR 自我延长。<\/li>\n<li>多产品共享网络容量，爆炸半径跨产品。<\/li>\n<\/ul>\n<h2>7. 既有防护与 SOP<\/h2>\n<ul>\n<li><strong>存在的控制<\/strong>: 有「数分钟内纠正」的目标（暗示存在期望响应时效）；监控能在数秒检测。<\/li>\n<li><strong>缺口或失效模式<\/strong>: 作用域控制失败；修复路径与数据面耦合。正式变更 SOP：<strong>报告未明确描述<\/strong>。<\/li>\n<\/ul>\n<h2>8. 后续改进措施（Action Items）<\/h2>\n<p>（原文极简；归档侧归类，owner：<strong>原文未指定<\/strong>）<\/p>\n<h3>Prevent / Mitigate / Process<\/h3>\n<ul>\n<li>全面事后复盘。<\/li>\n<li>工程冲刺：修复直接原因，并防范同类 blast-radius / 作用域失控问题。<\/li>\n<\/ul>\n<p>（可执行性偏弱：原文仅为方向性描述，未给可验收工件列表。）<\/p>\n<h3>Detect<\/h3>\n<ul>\n<li><strong>报告未单独列出<\/strong>。<\/li>\n<\/ul>\n<h2>9. 教训（Lessons）<\/h2>\n<p>报告未分项：<\/p>\n<ul>\n<li><strong>Poorly（归档摘要）<\/strong>: 变更 blast radius 控制是一等公民；修复通道须与生产数据面隔离。<\/li>\n<li><strong>Well<\/strong>: 检测很快（数秒）——原文强调，可视为 went well 的检测侧。<\/li>\n<li><strong>Lucky<\/strong>: <strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>10. 关键时间线（摘要）<\/h2>\n<ul>\n<li>（周日）— 小范围意图的网络配置变更被错误扩大应用<\/li>\n<li>（数秒内）— 检测到故障<\/li>\n<li>（远超数分钟）— 诊断并恢复正确配置（被拥塞拖慢）<\/li>\n<li>完整分钟级时间线：<strong>报告未提供<\/strong>；见 raw<\/li>\n<\/ul>"}, {"id": "github-2018-10-21-orchestrator-network-partition", "date": "2018-10-21", "dateSort": "2018-10-21", "dateUnknown": false, "company": "GitHub", "title": "October 21 post-incident analysis", "kind": "事故复盘", "url": "https://github.blog/news-insights/company-news/oct21-post-incident-analysis/", "completeness": "中高", "impact": "约 24h11m 降级服务；暂停 webhooks/Pages。 无用户数据永久丢失；部分写入需对账。 展示数据可能陈旧/不一致（完整性优先策略的代价）。 用户数/%：报告未量化。", "root": "Orchestrator（Raft）将 MySQL 主库 跨区域自动提升到 US West。 应用向西岸写入；东岸仍有 未复制的数秒写入 → 分叉 / 脑裂风险。", "analysisHtml": "<h1>October 21 post-incident analysis<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li><strong>公司<\/strong>: GitHub<\/li>\n<li><strong>标题<\/strong>: October 21 post-incident analysis<\/li>\n<li><strong>日期<\/strong>: 2018-10-21（持续至 2018-10-22；复盘发布 2018-10-30）<\/li>\n<li><strong>URL<\/strong>: https://github.blog/news-insights/company-news/oct21-post-incident-analysis/<\/li>\n<li><strong>原文路径<\/strong>: <code>raw/github-2018-10-21-orchestrator-network-partition.md<\/code><\/li>\n<li><strong>严重度 / 时长<\/strong>: 降级服务约 24 小时 11 分；无用户数据永久丢失<\/li>\n<li><strong>原文完整度<\/strong>: 中高（决策与后续步骤清楚；首次发现渠道略缺）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<ul>\n<li>约 24h11m 降级服务；暂停 webhooks/Pages。<\/li>\n<li>无用户数据永久丢失；部分写入需对账。<\/li>\n<li>展示数据可能陈旧/不一致（完整性优先策略的代价）。<\/li>\n<li>用户数/%：<strong>报告未量化<\/strong>。<\/li>\n<\/ul>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>光学维护期间出现的 <strong>43 秒网络分区<\/strong>。<\/p>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因（Proximate）<\/h3>\n<ul>\n<li>Orchestrator（Raft）将 MySQL 主库 <strong>跨区域自动提升到 US West<\/strong>。<\/li>\n<li>应用向西岸写入；东岸仍有 <strong>未复制的数秒写入<\/strong> → 分叉 / 脑裂风险。<\/li>\n<\/ul>\n<h3>3.2 促成因素（Contributing）<\/h3>\n<ul>\n<li>团队选择 <strong>数据完整性优先于快速回切<\/strong>：从备份恢复、fail-forward，接受长时间降级。<\/li>\n<li>跨区域自动提升与应用延迟/一致性模型不对齐。<\/li>\n<li>状态页粒度粗糙，沟通面受限。<\/li>\n<\/ul>\n<h3>3.3 为何防护没挡住 / 为何潜伏<\/h3>\n<ul>\n<li>自动故障转移在跨区域场景产生有害拓扑变化——自动化按设计运行，但设计假设与一致性模型冲突。<\/li>\n<li>短暂分区即可触发长恢复（备份重建 RTO）。<\/li>\n<\/ul>\n<h3>3.4 证据与未知<\/h3>\n<ul>\n<li>证据：43 秒分区、Orchestrator 跨区提升、完整性优先决策、24h11m、四条 next steps。<\/li>\n<li>未知：首次发现是监控还是 Orchestrator 事件本身触发。<\/li>\n<\/ul>\n<h2>4. 检测（Detection）<\/h2>\n<ul>\n<li>报告围绕 Orchestrator 自动提升与后续决策展开。<\/li>\n<li>首次发现方式：<strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<ul>\n<li><strong>临时止血 / 事故响应<\/strong>: 数据完整性优先——从备份恢复、fail-forward；暂停 webhooks/Pages；接受约 24h11m 降级。<\/li>\n<li><strong>永久修复<\/strong>: Orchestrator 禁止跨区域主库提升；更丰富多组件状态页；加速 active/active；混沌测试。<\/li>\n<\/ul>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<ul>\n<li>跨区域自动提升扩大拓扑变化代价。<\/li>\n<li>短分区触发长恢复（备份重建）。<\/li>\n<li>状态页粒度粗糙影响沟通。<\/li>\n<\/ul>\n<h2>7. 既有防护与 SOP<\/h2>\n<ul>\n<li><strong>存在的控制<\/strong>: Orchestrator 自动主库提升（设计内故障转移）；「完整性优先」是明确响应取向。<\/li>\n<li><strong>缺口或失效模式<\/strong>: 跨区域自动提升在该场景 <strong>设计有害<\/strong>（控制本身成放大器）；事后禁止。完整 runbook 全文：<strong>报告未展开<\/strong>。<\/li>\n<\/ul>\n<h2>8. 后续改进措施（Action Items）<\/h2>\n<p>（原文未标 Type/Owner；归档侧归类，owner：<strong>原文未指定<\/strong>）<\/p>\n<h3>Prevent<\/h3>\n<ul>\n<li>Orchestrator：禁止跨区域主库提升。<\/li>\n<li>加速 active/active 多活数据中心。<\/li>\n<\/ul>\n<h3>Detect / Process<\/h3>\n<ul>\n<li>更丰富的多组件状态页。<\/li>\n<li>加强主动故障注入 / 混沌测试。<\/li>\n<\/ul>\n<h3>Mitigate<\/h3>\n<ul>\n<li>（事故中）完整性优先 + 暂停 webhooks/Pages 已是 mitigations；长期 mitigate 与 active/active 重叠。<\/li>\n<\/ul>\n<h2>9. 教训（Lessons）<\/h2>\n<p>报告未正式分栏，但决策叙述清晰：<\/p>\n<ul>\n<li><strong>Well<\/strong>: 选择数据完整性、无永久用户数据丢失。<\/li>\n<li><strong>Poorly<\/strong>: 跨区域自动提升与应用模型不对齐；短分区可触发长恢复；状态页不足。<\/li>\n<li><strong>Lucky<\/strong>: <strong>报告未明确写运气因素<\/strong>。<\/li>\n<\/ul>\n<h2>10. 关键时间线（摘要）<\/h2>\n<ul>\n<li>（光学维护）— 43 秒网络分区<\/li>\n<li>（随后）— Orchestrator 将 MySQL 主提升到 US West；应用写西岸；东岸有未复制写入<\/li>\n<li>（决策）— 完整性优先：备份恢复、fail-forward；暂停 webhooks/Pages<\/li>\n<li>约 24h11m 后 — 降级结束；无永久数据丢失，部分写入需对账<\/li>\n<li>更细时间线见 raw / 原文<\/li>\n<\/ul>"}, {"id": "tencent-cloud-2018-08-qianyan-cdisk-integrity", "date": "2018-08", "dateSort": "2018-08-01", "dateUnknown": false, "company": "腾讯云", "title": "关于客户“前沿数控”数据完整性受损的技术复盘", "kind": "事故复盘", "url": "https://cloud.tencent.com/developer/article/1180156", "completeness": "中高", "impact": "客户「前沿数控」一块操作系统云盘故障，文件系统元数据损坏，业务受影响。 范围：报告聚焦该客户云盘三副本安全机制失效导致的完整性问题；未量化其他客户。", "root": "磁盘静默错误导致单副本数据错误；搬迁时关闭校验使错误数据写入新仓库；源仓库提前回收使可回退副本消失 → 三副本机制失效，异常扩散。", "analysisHtml": "<h1>关于客户“前沿数控”数据完整性受损的技术复盘<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li><strong>公司<\/strong>: 腾讯云<\/li>\n<li><strong>标题<\/strong>: 关于客户“前沿数控”数据完整性受损的技术复盘<\/li>\n<li><strong>日期<\/strong>: 2018-08（过程当日；说明 2018-08-07）<\/li>\n<li><strong>URL<\/strong>: https://cloud.tencent.com/developer/article/1180156<\/li>\n<li><strong>原文路径<\/strong>: <code>raw/tencent-cloud-2018-08-qianyan-cdisk-integrity.md<\/code><\/li>\n<li><strong>严重度 / 时长<\/strong>: 单客户操作系统云盘元数据损坏、数据完整性受损；仓库搬迁当日约 11:57–20:30 暴露<\/li>\n<li><strong>原文完整度<\/strong>: 中高（过程、违规点、改进清晰；影响面限于该客户场景）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<ul>\n<li>客户「前沿数控」一块操作系统云盘故障，文件系统元数据损坏，业务受影响。<\/li>\n<li>范围：报告聚焦该客户云盘三副本安全机制失效导致的完整性问题；未量化其他客户。<\/li>\n<\/ul>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>仓库Ⅰ空间使用率过高告警后发起搬迁扩容；搬迁中关闭数据校验并过早回收源数据。<\/p>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因（Proximate）<\/h3>\n<p>磁盘静默错误导致单副本数据错误；搬迁时关闭校验使错误数据写入新仓库；源仓库提前回收使可回退副本消失 → 三副本机制失效，异常扩散。<\/p>\n<h3>3.2 促成因素（Contributing）<\/h3>\n<ul>\n<li>静默错误本可被默认开启的搬迁校验发现并规避。<\/li>\n<li>「加速搬迁 / 尽快降使用率」驱动下，流程允许人工关闭校验与缩短源数据保留。<\/li>\n<li>源数据应保留 24 小时的缓冲未强制执行。<\/li>\n<\/ul>\n<h3>3.3 为何防护没挡住 / 为何潜伏<\/h3>\n<ul>\n<li>三副本假设建立在「副本内容正确且搬迁可校验」上；静默错误 + 关校验 + 毁源 连续击穿。<\/li>\n<li>危险操作可被人工绕过（校验非常开硬闸）。<\/li>\n<\/ul>\n<h3>3.4 证据与未知<\/h3>\n<ul>\n<li>证据：官方时间线与两项违规操作说明。<\/li>\n<li>未知：静默错误首次引入时刻、是否有更早巡检告警、完整客户侧 RTO：<strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>4. 检测（Detection）<\/h2>\n<ul>\n<li>11:57 仓库空间告警（诱因侧）；20:30 监控发现仓库Ⅱ部分云盘 IO 异常。<\/li>\n<li>客户侧如何首次感知：<strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<ul>\n<li>临时止血细节（数据抢救步骤）：<strong>报告未展开<\/strong>（仅致歉并称尽力帮助客户）。<\/li>\n<li>永久：数据安全流程自动化闭环；校验常开不可关；加速静默错误巡检与修复。<\/li>\n<\/ul>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<p>关校验使坏数据「合法」迁入；立即回收源端消灭回退窗口；三副本同时被污染。<\/p>\n<h2>7. 既有防护与 SOP<\/h2>\n<ul>\n<li><strong>存在的控制<\/strong>: 默认开启搬迁校验；源仓保留 24h；三副本；用户访问路径校验自愈；免费快照（可选）。<\/li>\n<li><strong>缺口或失效模式<\/strong>: 校验可被人工关闭；保留期可被违规缩短 → SOP/流程存在但可绕过（失效）。<\/li>\n<\/ul>\n<h2>8. 后续改进措施（Action Items）<\/h2>\n<p>（原文未标 Type/Owner）<\/p>\n<h3>Prevent<\/h3>\n<ul>\n<li>数据安全相关流程自动化闭环，降低人工干预。<\/li>\n<li>全流程数据安全校验常开，不允许关闭。<\/li>\n<\/ul>\n<h3>Detect<\/h3>\n<ul>\n<li>优化静默错误巡检：优先主副本、跳过近期已验证块，加速发现与修复。<\/li>\n<\/ul>\n<h3>Process / Mitigate<\/h3>\n<ul>\n<li>呼吁客户开启快照（客户侧防护）。<\/li>\n<li>责任到人与流程闭环（原文表述偏管理，owner：<strong>原文未指定<\/strong>）。<\/li>\n<\/ul>\n<h2>9. Lessons<\/h2>\n<ul>\n<li><strong>做得好<\/strong>: 公开承认违规操作与机制失效点。<\/li>\n<li><strong>做得差<\/strong>: 危险开关可人工关闭；保留策略未硬约束。<\/li>\n<li><strong>运气<\/strong>: <strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>10. 时间线（摘要）<\/h2>\n<p>11:57 空间告警 → 14:05 关校验搬迁 → 20:27 切流并回收源 → 20:30 IO 异常。<\/p>"}, {"id": "aliyun-2018-06-27-automation-ops-bug", "date": "2018-06-27", "dateSort": "2018-06-27", "dateUnknown": false, "company": "阿里云", "title": "6月27日阿里云因自动化运维bug导致的故障说明", "kind": "事故复盘", "url": "https://developer.aliyun.com/article/603866", "completeness": "低-中", "impact": "官网控制台；MQ、NAS、OSS 等部分产品功能访问异常。精确客户数/%：报告未说明。", "root": "自动化运维系统未知代码 bug：错误禁用部分内部 IP → 部分产品访问链路不通。", "analysisHtml": "<h1>6月27日阿里云因自动化运维bug导致的故障说明<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li><strong>公司<\/strong>: 阿里云<\/li>\n<li><strong>标题<\/strong>: 6月27日阿里云因自动化运维bug导致的故障说明<\/li>\n<li><strong>日期<\/strong>: 2018-06-27<\/li>\n<li><strong>URL<\/strong>: https://developer.aliyun.com/article/603866<\/li>\n<li><strong>原文路径<\/strong>: <code>raw/aliyun-2018-06-27-automation-ops-bug.md<\/code><\/li>\n<li><strong>严重度 / 时长<\/strong>: 约 16:21–16:50（约 29 分钟起陆续恢复）；控制台与部分产品功能<\/li>\n<li><strong>原文完整度<\/strong>: 低–中（有根因梗概与影响产品，缺详细时间线/改进清单）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<p>官网控制台；MQ、NAS、OSS 等部分产品功能访问异常。精确客户数/%：<strong>报告未说明<\/strong>。<\/p>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>上线自动化运维新功能过程中的变更验证操作。<\/p>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因<\/h3>\n<p>自动化运维系统未知代码 bug：错误禁用部分内部 IP → 部分产品访问链路不通。<\/p>\n<h3>3.2 促成因素<\/h3>\n<p>测试环境未暴露该 bug；变更验证在生产自动化系统触发缺陷。<\/p>\n<h3>3.3 为何防护没挡住<\/h3>\n<p>测试与生产行为不一致；自动化具备禁用内部 IP 的高危能力却缺有效防护（细节：<strong>报告未说明<\/strong>）。<\/p>\n<h3>3.4 证据与未知<\/h3>\n<p>短公告级；无代码级机制、无完整 AI 列表。<\/p>\n<h2>4. 检测（Detection）<\/h2>\n<p><strong>报告未说明<\/strong>（仅给出起止时间与「大量吐槽」语境）。<\/p>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<p>人工介入定位并恢复。永久：改进自动化运维技术与发布验证流程（方向性）。<\/p>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<p>错误禁用内部 IP 影响多产品链路（爆炸半径细节：<strong>报告未说明<\/strong>）。<\/p>\n<h2>7. 既有防护与 SOP<\/h2>\n<p>测试环境验证存在但未拦住；正式 SOP：<strong>报告未说明<\/strong>。<\/p>\n<h2>8. 后续改进措施（Action Items）<\/h2>\n<h3>Prevent / Process<\/h3>\n<ul>\n<li>改进自动化运维技术与发布验证流程（原文可执行性弱，owner 未指定）。<\/li>\n<\/ul>\n<h3>Detect / Mitigate<\/h3>\n<ul>\n<li>原文未单列。<\/li>\n<\/ul>\n<h2>9. Lessons<\/h2>\n<ul>\n<li><strong>做得好<\/strong>: 当日公开致歉并给出直接原因梗概。<\/li>\n<li><strong>做得差<\/strong>: 公告过短，缺少可验收 AI。<\/li>\n<li><strong>运气<\/strong>: <strong>报告未说明<\/strong>。<\/li>\n<\/ul>\n<h2>10. 时间线（摘要）<\/h2>\n<p>16:21 左右开始 → 人工恢复 → 16:50 起陆续恢复。<\/p>"}, {"id": "stripe-2017-kubernetes", "date": "2017-12-20", "dateSort": "2017-12-20", "dateUnknown": false, "company": "Stripe", "title": "Learning to operate Kubernetes reliably", "kind": "技术个案", "url": "https://stripe.com/blog/operating-kubernetes", "completeness": "中高（原文全文+HTML）", "impact": "迁移分布式cron系统与可靠性验证案例集，不是一次Stripe支付宕机。约500类job/20台机器目标；测试中发现Pod被全驱逐、任务不调度等问题。客户中断不是本文报告的结果。", "root": "具体机制包括：node controller在所有节点与API失联时可驱逐整个集群Pod；etcd单节点fsync慢会触发持续leader选举；cron名称超过52字符静默不调度；scheduler缓存引发回归/崩溃。原文部分只给问题与补丁链接，未逐个披露完整实现根因，应保留未知。", "analysisHtml": "<h1>Learning to operate Kubernetes reliably<\/h1>\n<p>公司：Stripe 类别：技术个案（迁移/故障演练案例集） 日期：2017-12-20（技术文若无事故日期则为发布日/未知） 原文：https://stripe.com/blog/operating-kubernetes 原文路径：raw/stripe-2017-kubernetes.md（同名HTML保留完整源页面） 分析标准：v2；正文标事实/未知/归档推断；时间均转Asia/Shanghai。<\/p>\n<h2>1. 影响（Impact）<\/h2>\n<p>迁移分布式cron系统与可靠性验证案例集，不是一次Stripe支付宕机。约500类job/20台机器目标；测试中发现Pod被全驱逐、任务不调度等问题。客户中断不是本文报告的结果。<\/p>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>引入Kubernetes调度系统，进行高负载、网络分区、组件失效与迁移演练；不同子问题触发不同，不能捏造一个事故时刻。<\/p>\n<h2>3.1 直接原因（Proximate）<\/h2>\n<p>具体机制包括：node controller在所有节点与API失联时可驱逐整个集群Pod；etcd单节点fsync慢会触发持续leader选举；cron名称超过52字符静默不调度；scheduler缓存引发回归/崩溃。原文部分只给问题与补丁链接，未逐个披露完整实现根因，应保留未知。<\/p>\n<h2>3.2 促成因素（Contributing）<\/h2>\n<p>新平台配置交互复杂、alpha cron控制器、监控/自动重建缺口；某次etcd切换后API超时直至重启。不能把所有问题合为同一条生产故障。<\/p>\n<h2>3.3 因果链<\/h2>\n<p>以网络分区子案：节点与API失联→node controller判不健康→驱逐→运行任务被终止。因果链为原文行为整理，未说明所有版本的算法细节。<\/p>\n<h2>3.4 证据与未知<\/h2>\n<p>阅读约400行cron逻辑；3节点1000job/min压测只稳定支持200，目标约50；game day直接验证组件消失；命名检查和补丁。数字来自作者当时环境，非本次基准/通用容量。<\/p>\n<h2>4. 检测（Detection）<\/h2>\n<p>演练/压测揭示；生产etcd一节点失联时告警，替换加入集群，Kubernetes持续运行。Pending超过5分钟有告警。<\/p>\n<h2>5. 止血与修复<\/h2>\n<p>迁移工具可快速退回旧Chronos，分低风险job逐步迁移；生产单etcd节点故障通过替换恢复。测试缺陷通过修配置、补监控与上游补丁。<\/p>\n<h2>6. 影响扩大（Amplifiers）<\/h2>\n<p>自动驱逐可能把控制面失联放大为数据面任务终止；过宽功能范围会增加运维复杂度（原文建议削范围）。<\/p>\n<h2>7. 既有防护与SOP<\/h2>\n<p>明确SLO、三副本etcd、备份恢复/全重建测试、game day、渐进迁移；演练发现监控没page和重建需人工。正式SOP文本未说明。<\/p>\n<h2>8. 后续改进措施（按Prevent/Detect/Mitigate/Process归类）<\/h2>\n<p>原文实践分类：Prevent修上游bug、名字唯一/长度测试；Detect补监控/Pending告警；Mitigate高可用etcd及迁移回退工具；Process持续game day/阅读源码、限制功能范围。计划未来内存cgroups，不应写成已落地。<\/p>\n<h2>9. Lessons（归档侧解读，非官方三分栏）<\/h2>\n<p>Well演练把未知暴露在可控环境，并按内部用户需求定义SLO；Poorly现成平台并不自动可靠；Lucky原文说有低风险job可先迁移。<\/p>\n<h2>10. 关键时间线<\/h2>\n<p>先业务SLO→压测/etcd高可用→渐进迁移与bug修复→game day→扩展。约5个月、3工程师全职是文章对项目总结，非事故时长。发布日期2017-12-20。<\/p>\n<p>学习价值：把SLO、可回退迁移和故障演练串成可信生产引入过程。<\/p>"}, {"id": "aws-2017-02-28-s3-us-east-1-command-typo", "date": "2017-02-28", "dateSort": "2017-02-28", "dateUnknown": false, "company": "AWS", "title": "Summary of the Amazon S3 Service Disruption in the Northern Virginia (US-EAST-1) Region", "kind": "事故复盘", "url": "https://aws.amazon.com/message/41926/", "completeness": "中", "impact": "US-EAST-1 S3 在索引/放置子系统重启期间无法正常服务请求。 依赖服务受影响：S3 控制台、EC2 启动、从快照建 EBS、Lambda 等。 Service Health Dashboard 管理控制台依赖单区域 S3，事故期间状态页自身无法更新。 约 12:26 PST GET/LIST/DELETE 恢复；约 1:54 PST 全 API。精确用户数/%：报告未量化。", "root": "命令输入错误，实际移除的服务器集合远大于意图，包含 S3 索引子系统 与 放置（placement）子系统 所需容量。 两子系统被迫 全量重启；重启期间 S3 无法正常服务。", "analysisHtml": "<h1>Summary of the Amazon S3 Service Disruption in the Northern Virginia (US-EAST-1) Region<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li><strong>公司<\/strong>: AWS<\/li>\n<li><strong>标题<\/strong>: Summary of the Amazon S3 Service Disruption in the Northern Virginia (US-EAST-1) Region<\/li>\n<li><strong>日期<\/strong>: 2017-02-28<\/li>\n<li><strong>URL<\/strong>: https://aws.amazon.com/message/41926/<\/li>\n<li><strong>原文路径<\/strong>: <code>raw/aws-2017-02-28-s3-us-east-1-command-typo.md<\/code><\/li>\n<li><strong>严重度 / 时长<\/strong>: US-EAST-1 S3 及依赖服务数小时；约 12:26 PST GET/LIST/DELETE 可用，约 1:54 PST 全 API（原文未给精确开始时刻）<\/li>\n<li><strong>原文完整度<\/strong>: 中（触发、机制、依赖影响与改进清楚；检测渠道与精确开始时间缺失）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<ul>\n<li>US-EAST-1 S3 在索引/放置子系统重启期间无法正常服务请求。<\/li>\n<li>依赖服务受影响：S3 控制台、EC2 启动、从快照建 EBS、Lambda 等。<\/li>\n<li>Service Health Dashboard 管理控制台依赖单区域 S3，事故期间状态页自身无法更新。<\/li>\n<li>约 12:26 PST GET/LIST/DELETE 恢复；约 1:54 PST 全 API。精确用户数/%：<strong>报告未量化<\/strong>。<\/li>\n<\/ul>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>排查 S3 计费子系统缓慢时，授权工程师按既有 playbook 执行「小规模移除容量」命令，但输入错误。<\/p>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因（Proximate）<\/h3>\n<ul>\n<li>命令输入错误，实际移除的服务器集合远大于意图，包含 <strong>S3 索引子系统<\/strong> 与 <strong>放置（placement）子系统<\/strong> 所需容量。<\/li>\n<li>两子系统被迫 <strong>全量重启<\/strong>；重启期间 S3 无法正常服务。<\/li>\n<\/ul>\n<h3>3.2 促成因素（Contributing）<\/h3>\n<ul>\n<li>运维工具缺少「不得低于最低容量」硬闸与输入安全校验。<\/li>\n<li>索引/放置是数据路径核心；同区大量服务依赖 S3。<\/li>\n<li>SHD 管理依赖单区 S3，沟通面受损。<\/li>\n<li>核心子系统恢复路径是全量重启，规模大则 RTO 长。<\/li>\n<\/ul>\n<h3>3.3 为何防护没挡住 / 为何潜伏<\/h3>\n<ul>\n<li>Playbook 存在，但工具层允许错误输入越界执行（控制设计不足，非「未执行 playbook」）。<\/li>\n<li>报告未写该工具此前是否有过类似接近事故。<\/li>\n<\/ul>\n<h3>3.4 证据与未知<\/h3>\n<ul>\n<li>证据：官方对命令意图 vs 实际效果、子系统重启、依赖服务列表、恢复时刻、后续工具改动的描述。<\/li>\n<li>未知：首次发现渠道；精确影响开始时刻；用户可见百分比。<\/li>\n<\/ul>\n<h2>4. 检测（Detection）<\/h2>\n<ul>\n<li><strong>报告未说明<\/strong>首次发现渠道（监控告警 / 操作员即时察觉 / 客户报障等）。<\/li>\n<li>仅描述重启期间无法服务及依赖服务受影响。<\/li>\n<\/ul>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<ul>\n<li><strong>临时止血 / 恢复<\/strong>: 完成索引与放置子系统全量重启并等待容量恢复（12:26 / 1:54 PST 里程碑）。<\/li>\n<li><strong>永久修复<\/strong>: 工具更慢移除容量并加最低容量硬闸；审计其他工具；索引进一步 cell 分区；SHD 多区域（见第 8 节）。<\/li>\n<\/ul>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<ul>\n<li>子系统规模大导致重启恢复慢。<\/li>\n<li>同区依赖服务连带受损。<\/li>\n<li>SHD 管理依赖单区 S3，状态页无法更新，放大客户不确定性。<\/li>\n<\/ul>\n<h2>7. 既有防护与 SOP<\/h2>\n<ul>\n<li><strong>存在的控制<\/strong>: 既有 playbook（容量移除）；授权工程师操作。<\/li>\n<li><strong>缺口或失效模式<\/strong>: 工具缺少最低容量硬闸与安全输入校验——<strong>SOP/playbook 被执行，但工具设计不足以防止越界<\/strong>（执行了但挡不住）。<\/li>\n<\/ul>\n<h2>8. 后续改进措施（Action Items）<\/h2>\n<p>（原文未标 Type/Owner；归档侧归类，owner：<strong>原文未指定<\/strong>）<\/p>\n<h3>Prevent<\/h3>\n<ul>\n<li>工具改为更慢地移除容量，并增加防护，禁止降到最低容量以下。<\/li>\n<li>审计其他运维工具是否缺少同类检查。<\/li>\n<\/ul>\n<h3>Mitigate / Blast-radius<\/h3>\n<ul>\n<li>优先推进索引子系统进一步 cell 分区，以加快恢复。<\/li>\n<li>SHD 管理控制台不再依赖单区域 S3（改为多区域）。<\/li>\n<\/ul>\n<h3>Detect / Process<\/h3>\n<ul>\n<li>报告未单列新的检测或演练条目。<\/li>\n<\/ul>\n<h2>9. 教训（Lessons）<\/h2>\n<p>报告未按 well / poorly / lucky 分项：<\/p>\n<ul>\n<li><strong>Poorly（归档摘要）<\/strong>: 危险运维工具必须有硬闸与慢速执行；状态页依赖面不能与被监控服务同命运。<\/li>\n<li><strong>Well / Lucky<\/strong>: <strong>报告未分项说明<\/strong>。<\/li>\n<\/ul>\n<h2>10. 关键时间线（摘要）<\/h2>\n<ul>\n<li>（时刻未详）— 调试 S3 计费缓慢；执行 playbook 容量移除（输入错误）<\/li>\n<li>（时刻未详）— 索引与放置子系统进入全量重启；S3 与依赖服务受影响；SHD 更新受阻<\/li>\n<li>~12:26 PST — GET/LIST/DELETE 可用<\/li>\n<li>~1:54 PST — 全 API 恢复<\/li>\n<li>更细时间线：<strong>报告未提供<\/strong>完整分钟级表；见 raw<\/li>\n<\/ul>"}, {"id": "meituan-2016-spring-mvc", "date": "2016-09-30", "dateSort": "2016-09-30", "dateUnknown": false, "company": "美团", "title": "Spring MVC注解故障追踪记", "kind": "技术个案", "url": "https://tech.meituan.com/2016/09/30/mt-trip-springmvc-service-annotation-problem-research.html", "completeness": "中高（原文全文+HTML）", "impact": "测试环境接口调用失败，请求URL被拼为null前缀；本地单元测试通过。原文非生产大面积事故，生产客户影响不适用。", "root": "Spring的singleton是每容器而非全进程唯一：ContextLoaderListener创建root上下文，DispatcherServlet另建子上下文；两者各实例化同一Service。父容器用XML覆盖Bean并注入URL等属性；子容器只有注解实例，属性保持null/0。DispatcherServlet优先使用自己的Bean，遮蔽父容器完整Bean，导致错误URL与调用失败。", "analysisHtml": "<h1>Spring MVC注解故障追踪记<\/h1>\n<p>公司：美团 类别：技术个案（测试环境） 日期：2016-09-30（技术文若无事故日期则为发布日/未知） 原文：https://tech.meituan.com/2016/09/30/mt-trip-springmvc-service-annotation-problem-research.html 原文路径：raw/meituan-2016-spring-mvc.md（同名HTML保留完整源页面） 分析标准：v2；正文标事实/未知/归档推断；时间均转Asia/Shanghai。<\/p>\n<h2>1. 影响（Impact）<\/h2>\n<p>测试环境接口调用失败，请求URL被拼为null前缀；本地单元测试通过。原文非生产大面积事故，生产客户影响不适用。<\/p>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>为接口实现类添加@Service，同时项目父/子WebApplicationContext均扫描同一大包，父容器另有XML属性配置。<\/p>\n<h2>3.1 直接原因（Proximate）<\/h2>\n<p>Spring的singleton是每容器而非全进程唯一：ContextLoaderListener创建root上下文，DispatcherServlet另建子上下文；两者各实例化同一Service。父容器用XML覆盖Bean并注入URL等属性；子容器只有注解实例，属性保持null/0。DispatcherServlet优先使用自己的Bean，遮蔽父容器完整Bean，导致错误URL与调用失败。<\/p>\n<h2>3.2 促成因素（Contributing）<\/h2>\n<p>父子容器扫描边界重叠，XML与注解混用；本地UT只加载一个配置文件，无法复现双上下文，因此测试通过并不证明部署配置正确。<\/p>\n<h2>3.3 因果链<\/h2>\n<p>重复扫描→两个容器两个“单例”→子容器半成品遮蔽父Bean→属性缺失→HTTP请求失败。正式5 Whys未提供。<\/p>\n<h2>3.4 证据与未知<\/h2>\n<p>启动日志的Bean override只解释父容器内部替换；jmap确认2个实例，堆dump/jhat/MAT显示一份属性齐全、一份空值，引用链分别归属ContextLoaderListener与DispatcherServlet。源码验证父子查找规则。公开页面含演示配置值，本档案不复制其中疑似secret字段。<\/p>\n<h2>4. 检测（Detection）<\/h2>\n<p>测试环境一测即报错；通过增删@Service稳定复现。报警系统、MTTD不适用/未说明。<\/p>\n<h2>5. 止血与修复<\/h2>\n<p>去掉@Service可消除现象但作者认为治标；结构性修复是扫描隔离，用include/exclude filters规范不同容器职责，确保只使用完整注入实例。<\/p>\n<h2>6. 影响扩大（Amplifiers）<\/h2>\n<p>单元测试与真实容器装配不同使问题难定位；未报告业务范围扩张。<\/p>\n<h2>7. 既有防护与SOP<\/h2>\n<p>存在本地单测和测试环境验证，后者实际挡住缺陷。正式SOP未说明，不能称测试全失效。<\/p>\n<h2>8. 后续改进措施（按Prevent/Detect/Mitigate/Process归类）<\/h2>\n<p>原文建议分类：Prevent：隔离扫描范围；规范注解/属性注入方式；遵循框架最佳实践。Detect：借助实例数及引用链核对实际依赖注入图。Mitigate：删除注解是临时选项。Process：理解父子容器机制。Owner、截止时间未说明。<\/p>\n<h2>9. Lessons（归档侧解读，非官方三分栏）<\/h2>\n<p>归档侧：Well没有停在删注解，追到堆对象与容器所有权；Poorly误把单例当全进程唯一。Lucky不适用。自提建议：集成测试加载真实父子上下文并断言Bean身份/必填属性。<\/p>\n<h2>10. 关键时间线<\/h2>\n<p>本地单测→测试环境报错→增删注解复现→启动日志→堆对象数量/引用链→扫描隔离。文中日志示例为2015年12月，文章2016-09-30；不据日志猜总故障时长。<\/p>\n<p>学习价值：单例有作用域；堆引用链能证明依赖注入问题，测试需覆盖真实装配。<\/p>"}, {"id": "bytedance-binder-bundle", "date": "日期未确认", "dateSort": "0000-00-00", "dateUnknown": true, "company": "字节跳动", "title": "使用火山引擎 APMPlus 解决抖音Top 1 Java 崩溃的通用优化方案", "kind": "技术个案", "url": "https://developer.volcengine.com/articles/7599494088513028139", "completeness": "中高（原文全文+HTML）", "impact": "抖音Android近3个月多次报警，成为Java Top1崩溃；指单个issue而非全App不可用。绝对用户量/崩溃率未说明；原文称方案解决约97%该issue。", "root": "App通过Binder把onSaveInstanceState数据送至system_server，接收方共享Binder mmap缓冲（文中版本约1M-8K）无法分配足够连续空间，传输FAILED_TRANSACTION；较大parcel在JNI层抛TransactionTooLargeException。200KB是该错误分支的异常分类门槛，不是Binder实际安全容量；500KB也可能因共享空间不足失败。", "analysisHtml": "<h1>使用火山引擎 APMPlus 解决抖音Top 1 Java 崩溃的通用优化方案<\/h1>\n<p>公司：字节跳动 类别：技术个案（客户端崩溃治理） 日期：日期未确认（技术文若无事故日期则为发布日/未知） 原文：https://developer.volcengine.com/articles/7599494088513028139 原文路径：raw/bytedance-binder-bundle.md（同名HTML保留完整源页面） 分析标准：v2；正文标事实/未知/归档推断；时间均转Asia/Shanghai。<\/p>\n<h2>1. 影响（Impact）<\/h2>\n<p>抖音Android近3个月多次报警，成为Java Top1崩溃；指单个issue而非全App不可用。绝对用户量/崩溃率未说明；原文称方案解决约97%该issue。<\/p>\n<h2>2. 导火索（Trigger）<\/h2>\n<p>Activity stop/start时保存/传递Bundle，复杂页面产生过大状态；无单一部署或某日全站导火索，属于累积客户端问题。<\/p>\n<h2>3.1 直接原因（Proximate）<\/h2>\n<p>App通过Binder把onSaveInstanceState数据送至system_server，接收方共享Binder mmap缓冲（文中版本约1M-8K）无法分配足够连续空间，传输FAILED_TRANSACTION；较大parcel在JNI层抛TransactionTooLargeException。200KB是该错误分支的异常分类门槛，不是Binder实际安全容量；500KB也可能因共享空间不足失败。<\/p>\n<h2>3.2 促成因素（Contributing）<\/h2>\n<p>日志只有系统栈、Bundle stats未细分业务数据；Framework与业务共同贡献状态。targetSdk差异改变异常抛出行为；约97.25%为activityStopped，约2.75%为三星start兼容问题。<\/p>\n<h2>3.3 因果链<\/h2>\n<p>复杂页面状态→Bundle大→跨进程接收分配失败→异常经JNI抛回→高targetSdk重新throw→客户端崩溃。不是所有超过1KB数据都会崩，1KB是作者方案主动处理阈值。<\/p>\n<h2>3.4 证据与未知<\/h2>\n<p>多维分布、几十份logcat/堆栈、源码与root demo驱动日志（no address space），16MB状态恢复验证。未知：全部业务字段贡献、当前新Android版本通用性。<\/p>\n<h2>4. 检测（Detection）<\/h2>\n<p>线上崩溃监控全量/灰度异常激增告警；使用APM聚合与单次日志。<\/p>\n<h2>5. 止血与修复<\/h2>\n<p>采用ActivityLifecycleCallbacks在保存后将大Bundle序列化留内存Map，仅传UUID，恢复前取回；Map容量清理防自身膨胀。为性能选择仅内存、不做外存，不能保证进程被杀后完整状态恢复；原文说明此权衡。<\/p>\n<h2>6. 影响扩大（Amplifiers）<\/h2>\n<p>复杂页面与系统共享缓冲；缺业务归因使定位慢。无服务端级联；该项不应机械写成全站爆炸半径。<\/p>\n<h2>7. 既有防护与SOP<\/h2>\n<p>已有崩溃监控；系统异常保护并非所有targetSdk都吞异常。SOP、oncall、正式回滚均未说明/不适用该技术文章。<\/p>\n<h2>8. 后续改进措施（按Prevent/Detect/Mitigate/Process归类）<\/h2>\n<p>原文已实施：Prevent/Mitigate UUID替代Bundle、容量清理、已全量并集成APMPlus；Process跨进程不直接传大数据、活动上线前演练。Detect未单列新增承诺。剩余三星start问题此次未优化。Owner/期限未说明。<\/p>\n<h2>9. Lessons（归档侧解读，非官方三分栏）<\/h2>\n<p>归档侧：Well从异常分类一路追到接收缓冲分配；明确修复范围和功能/性能权衡；Poorly系统栈缺业务归因。Lucky未说明。自提建议：回归进程重建和内存Map淘汰后行为（非原文承诺）。<\/p>\n<h2>10. 关键时间线<\/h2>\n<p>近3个月报警→特征聚合→堆栈/源码/驱动demo→Hook方案→16MB验证→上线。文章原始发布日期未确认，事件无分钟级时间线。<\/p>\n<p>学习价值：分清异常分类阈值与真实资源上限，修复时公开状态恢复语义的权衡。<\/p>"}, {"id": "pingcap-case500-thp-kernel-hang", "date": "日期未说明（TiDB 2.1.6 时期）", "dateSort": "0000-00-00", "dateUnknown": true, "company": "PingCAP", "title": "case500：内核频繁 Hang 住，TiKV 无法提供服务，强制重启机器后恢复", "kind": "技术个案", "url": "https://github.com/pingcap/tidb-map/blob/master/maps/diagnose-case-study/case500.md", "completeness": "中高（原文全文+6 张截图；原文本身短，无影响/时间线）", "impact": "部署 TiKV 的机器内核反复 Hang 住，TiKV 无法提供服务，只能强制重启机器恢复。 受影响节点数、业务影响、持续时长、Hang 频率：报告未说明。", "root": "内存长期处于压力下，所有 NUMA node 的 Normal zone 剩余页都低于 min 水位线（vmcore 截图：Node 0 Normal zone NR_FREE_PAGES=10460，MIN=10932）。低于 min 后，所有从 Normal zone 申请内存的线程都必须先参与直接内存回收才能拿到内存。 内核在缺页异常处理路径上卡住：hung task 截图显示 pd-0 线程处于 D 状态超过 120 秒，调用栈为 page_fault → do_page_fault → do_page_fault → down_read …", "analysisHtml": "<h1>[技术个案] PingCAP 诊断案例 case500：在线关闭 THP 后内核频繁 Hang，TiKV 无法服务<\/h1>\n<h2>元信息<\/h2>\n<ul>\n<li>公司：PingCAP（TiDB 厂商官方诊断案例库；客户/环境身份未披露）<\/li>\n<li>标题：tidb-map diagnose-case-study case500（原文无单独标题，现象为&quot;内核频繁 Hang 住，TiKV 无法提供服务，强制重启机器后恢复&quot;）<\/li>\n<li>日期：报告未说明（案例未标事件日期；环境为 TiDB 2.1.6 / CentOS 7.6 内核 3.10.0-957，属历史案例）<\/li>\n<li>原文：https://github.com/pingcap/tidb-map/blob/master/maps/diagnose-case-study/case500.md<\/li>\n<li>发现入口：PingCAP TiDB 问题导图 https://docs.pingcap.com/zh/tidb/stable/tidb-troubleshooting-map/<\/li>\n<li>原文路径：raw/pingcap-case500-thp-kernel-hang.md（逐字原文）；raw/pingcap-case500-thp-kernel-hang.html（GitHub 页面）；raw/pingcap-case500-resources/（6 张证据截图）<\/li>\n<li>类别：技术个案（数据库 + Linux 内核内存管理疑难排障；不是 PingCAP 自身服务事故）<\/li>\n<li>严重度/时长：报告未说明（只说&quot;频繁 Hang&quot;、需强制重启恢复）<\/li>\n<li>原文完整度：中高（原文已全文归档且含截图证据；但原文本身是短案例，无影响量化、无时间线、无后续是否复发的验证）<\/li>\n<\/ul>\n<h2>1. 影响（Impact）<\/h2>\n<ul>\n<li>部署 TiKV 的机器内核反复 Hang 住，TiKV 无法提供服务，只能强制重启机器恢复。<\/li>\n<li>受影响节点数、业务影响、持续时长、Hang 频率：报告未说明。<\/li>\n<\/ul>\n<h2>2. 导火索（Trigger）<\/h2>\n<ul>\n<li>Hang 出现前约两周，在<strong>系统运行中在线关闭了 THP<\/strong>（Transparent Hugepage）。<\/li>\n<li>注意：回滚 THP 配置后 Hang 仍出现——说明&quot;在线切换&quot;已造成的内存状态（碎片）不随配置回滚消失（原文结论支持此解读）。<\/li>\n<li>持续的内存压力是触发 Hang 的必要条件（原文结论）。<\/li>\n<\/ul>\n<h2>3. 根因（详尽）<\/h2>\n<h3>3.1 直接原因（Proximate）<\/h3>\n<ul>\n<li>内存长期处于压力下，所有 NUMA node 的 Normal zone 剩余页都低于 <strong>min 水位线<\/strong>（vmcore 截图：Node 0 Normal zone NR_FREE_PAGES=10460，MIN=10932）。低于 min 后，所有从 Normal zone 申请内存的线程都必须先参与<strong>直接内存回收<\/strong>才能拿到内存。<\/li>\n<li>内核在<strong>缺页异常处理路径<\/strong>上卡住：hung task 截图显示 <code>pd-0<\/code> 线程处于 D 状态超过 120 秒，调用栈为 <code>page_fault → do_page_fault → __do_page_fault → down_read → rwsem_down_read_failed → schedule<\/code>，即在缺页时等待读写信号量（进程地址空间锁）。原文将其概括为&quot;处理缺页异常时发生了信号量死锁，且引发条件和 alloc stall 有关&quot;。<\/li>\n<li>用户态表现：TiKV 日志出现大量 <code>channel overflow<\/code>，无法及时写日志；<code>top<\/code> 显示 Load 很高但 CPU 利用率不高——典型的大量线程阻塞在不可中断睡眠（D 状态）。<\/li>\n<\/ul>\n<h3>3.2 根因机制（原文结论）<\/h3>\n<ul>\n<li>在持续内存压力下动态开/关 THP，会触发大页与小页之间的转换（页面迁移、内存规整/compaction），导致<strong>内存碎片过多<\/strong>。<\/li>\n<li>碎片 + 持续压力 → 分配频繁失败、alloc stall/mem stall 持续升高、<code>sar -B<\/code> 的 <code>pscand/s<\/code>（直接回收扫描页数）持续偏高 → 跌破 min 水位 → 全员直接回收 → 缺页路径上的锁等待链拖死系统。<\/li>\n<\/ul>\n<h3>3.3 促成因素（Contributing）<\/h3>\n<ol>\n<li><strong>在线修改 THP<\/strong>：运维变更直接在运行中切换内核内存特性，而原文建议的做法是开机即关或修改后重启。<\/li>\n<li><strong>脏页积累<\/strong>：原文建议&quot;根据磁盘 IO 能力适当降低 dirty_ratio&quot;，说明大量脏页拖慢回收、加重了内存压力（原文以建议形式给出，具体脏页数值未说明）。<\/li>\n<li><strong>长期高内存压力<\/strong>：业务内存使用与系统可回收余量之间缺少余量（原文未给出内存配置数值）。<\/li>\n<li><strong>回滚配置不等于回滚状态<\/strong>：THP 配置回滚后碎片状态仍在，导致&quot;回滚无效&quot;误导排查（归档侧推断，由&quot;回滚后 Hang 仍出现&quot;+&quot;碎片&quot;结论得出）。<\/li>\n<li><strong>旧内核<\/strong>：3.10 系列内核在内存规整/回收方面的行为（是否存在已知缺陷）原文未说明，不作结论。<\/li>\n<\/ol>\n<h3>3.4 Five Whys（归档侧整理）<\/h3>\n<ol>\n<li>为何 TiKV 不可用？→ 机器内核 Hang，线程卡在 D 状态。<\/li>\n<li>为何内核 Hang？→ 缺页路径上等待地址空间信号量，且所有线程都在做直接回收。<\/li>\n<li>为何都在直接回收？→ Normal zone 剩余内存低于 min 水位。<\/li>\n<li>为何长期低于 min？→ 持续内存压力 + 在线切换 THP 造成严重碎片 + 脏页积累拖慢回收。<\/li>\n<li>为何会在线切换 THP 且回滚无效？→ 缺少&quot;内核内存参数变更须重启/须评估&quot;的变更规范；回滚只改配置不清状态。<\/li>\n<\/ol>\n<h3>3.5 证据与未知<\/h3>\n<ul>\n<li>证据（原文 + 截图）：TiKV channel overflow 日志、top 高 Load 低 CPU、mem stall/alloc stall 曲线持续升高、<code>sar -B<\/code> pscand/s 偏高、hung task 调用栈、kdump vmcore 中各 node Normal zone 低于 min 水位。dmesg 在 Hang 前未见异常（原文）。<\/li>\n<li>未知（报告未说明）：机器内存规格与 TiKV 内存配置；&quot;信号量死锁&quot;的持有者是谁（截图只显示等待方，未显示持锁方）；修复后是否再未复现；THP 在线关闭的具体方式（<code>never<\/code> 还是 <code>madvise<\/code>、是否同时关闭 defrag）。<\/li>\n<li>原文&quot;死锁&quot;一词是作者结论，截图本身能证明的是&quot;缺页路径上长时间等待读写信号量&quot;，归档时保留原表述并注明此点。<\/li>\n<\/ul>\n<h2>4. 检测（Detection）<\/h2>\n<ul>\n<li>现象层面：内核 Hang、TiKV 无法服务被发现（具体告警渠道：报告未说明）。<\/li>\n<li>诊断路径（本案的主要学习点）：TiKV 日志 → top（高 Load/低 CPU 指向内核阻塞）→ Hang 前系统监控（mem stall、alloc stall）与 dmesg → <code>sar -B<\/code> → hung task 内核调用栈 → 开启 kdump 在 Hang 时抓 vmcore，分析各 zone 水位。<\/li>\n<\/ul>\n<h2>5. 止血（Mitigation）与修复（Fix）<\/h2>\n<ul>\n<li>临时止血：强制重启机器。<\/li>\n<li>永久修复（原文建议，非验证结果）：<\/li>\n<p>- 在系统启动时就关闭 THP；若已在线关闭，则重启系统。 - 根据磁盘 IO 能力适当降低 <code>dirty_ratio<\/code>，避免积累大量脏页、减缓回收压力。<\/p>\n<li>原文未说明实施后效果。<\/li>\n<\/ul>\n<h2>6. 影响为何被扩大（Amplifiers）<\/h2>\n<ul>\n<li>低于 min 水位后&quot;所有线程都参与直接回收&quot;，把内存问题从个别分配扩散到全机所有需要内存的线程。<\/li>\n<li>缺页路径上的锁等待使大量线程进入 D 状态，Load 飙升，日志写不出（channel overflow），排障信息本身也受影响。<\/li>\n<li>回滚配置无效 → 问题反复出现。<\/li>\n<\/ul>\n<h2>7. 既有防护与 SOP<\/h2>\n<ul>\n<li>TiDB 部署文档历来建议关闭 THP（原文未引用，此处不作为本案事实）；本案问题不在&quot;是否关闭&quot;，而在&quot;在线关闭&quot;的方式。<\/li>\n<li>系统监控（mem stall/alloc stall）存在且事后可用于诊断，但 Hang 前是否有告警：报告未说明。<\/li>\n<li>kdump 是事后开启的（&quot;开启 kdump 在 Hang 时生成 vmcore&quot;），说明此前未常开（推断）。<\/li>\n<li>变更规范 / SOP：报告未说明。<\/li>\n<\/ul>\n<h2>8. 后续改进措施（原文仅为规避建议，归档侧按类型整理）<\/h2>\n<h3>Prevent<\/h3>\n<ul>\n<li>THP 在启动参数中关闭，或在线修改后重启（原文）。<\/li>\n<li>按磁盘 IO 能力调低 dirty_ratio（原文）。<\/li>\n<\/ul>\n<h3>Detect（归档侧建议，非原文）<\/h3>\n<ul>\n<li>对 PSI memory stall、allocstall、pgscan_direct 设告警；对 Normal zone 剩余页与 min/low 水位的比值做监控。<\/li>\n<li>生产机常开 kdump 与 hung_task 检测，保证下次 Hang 有现场。<\/li>\n<\/ul>\n<h3>Process（归档侧建议，非原文）<\/h3>\n<ul>\n<li>内核内存相关参数（THP、dirty_*、min_free_kbytes）变更纳入变更评审，明确&quot;需重启生效&quot;的项。<\/li>\n<\/ul>\n<h2>9. Lessons（归档侧解读）<\/h2>\n<ul>\n<li><strong>做得好<\/strong>：证据链完整——从应用日志一路下钻到 vmcore 水位，每一步都有截图。<\/li>\n<li><strong>做得差<\/strong>：在线修改内核内存特性；回滚后仍出现时才意识到问题不在当前配置。<\/li>\n<li><strong>运气<\/strong>：报告未说明。<\/li>\n<li><strong>可迁移经验<\/strong>：① &quot;高 Load + 低 CPU&quot; 优先查 D 状态线程与内核栈；② 配置回滚无效时，要考虑配置已经改变了&quot;状态&quot;（碎片、缓存、连接池等）；③ 内存类 Hang 要提前准备 kdump，否则现场无法保留。<\/li>\n<\/ul>\n<h2>10. 关键时间线<\/h2>\n<ul>\n<li>报告未给出具体日期/时刻。相对顺序：在线关闭 THP →（约两周后）内核开始频繁 Hang → 回滚 THP 配置，Hang 仍出现 → 依次收集日志/监控/调用栈 → 开启 kdump 抓 vmcore → 得出碎片 + 低于 min 水位结论 → 给出启动时关 THP / 重启、调低 dirty_ratio 的建议。<\/li>\n<\/ul>\n<p>学习价值：中文数据库/内核疑难排障范例——从应用症状下钻到内核内存水位，说明&quot;在线切换 THP 的后果不会随配置回滚消失&quot;。<\/p>"}]</script>
<script>
(function () {
  "use strict";

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  var ENTRIES = [];
  try {
    ENTRIES = JSON.parse(document.getElementById("DATA").textContent);
  } catch (e) {
    document.getElementById("list").innerHTML = "<div class='empty'><h3>数据加载失败</h3><p>请检查内嵌 JSON。</p></div>";
    return;
  }

  var state = { q: "", company: "", kind: "", sort: "date-desc", openId: null };

  var el = {
    q: document.getElementById("q"),
    company: document.getElementById("company"),
    sort: document.getElementById("sort"),
    clearBtn: document.getElementById("clearBtn"),
    list: document.getElementById("list"),
    empty: document.getElementById("empty"),
    shown: document.getElementById("shownCount"),
    all: document.getElementById("allCount"),
    total: document.getElementById("totalCount"),
    hint: document.getElementById("filterHint"),
    overlay: document.getElementById("overlay"),
    drawer: document.getElementById("drawer"),
    drawerTitle: document.getElementById("drawerTitle"),
    drawerSub: document.getElementById("drawerSub"),
    drawerBody: document.getElementById("drawerBody"),
    drawerSource: document.getElementById("drawerSource"),
    closeDrawer: document.getElementById("closeDrawer"),
    kindAll: document.getElementById("kindAll"),
    kindIncident: document.getElementById("kindIncident"),
    kindCase: document.getElementById("kindCase")
  };

  el.total.textContent = String(ENTRIES.length);
  el.all.textContent = String(ENTRIES.length);

  Array.from(new Set(ENTRIES.map(function (e) { return e.company; })))
    .sort(function (a, b) { return a.localeCompare(b, "zh"); })
    .forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      el.company.appendChild(opt);
    });

  function setKind(kind) {
    state.kind = kind;
    el.kindAll.setAttribute("aria-pressed", kind === "" ? "true" : "false");
    el.kindIncident.setAttribute("aria-pressed", kind === "事故复盘" ? "true" : "false");
    el.kindCase.setAttribute("aria-pressed", kind === "技术个案" ? "true" : "false");
    render();
  }

  el.kindAll.addEventListener("click", function () { setKind(""); });
  el.kindIncident.addEventListener("click", function () { setKind("事故复盘"); });
  el.kindCase.addEventListener("click", function () { setKind("技术个案"); });

  var searchTimer = null;
  el.q.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = el.q.value.trim();
      render();
    }, 120);
  });
  el.company.addEventListener("change", function () {
    state.company = el.company.value;
    render();
  });
  el.sort.addEventListener("change", function () {
    state.sort = el.sort.value;
    render();
  });
  el.clearBtn.addEventListener("click", function () {
    state.q = "";
    state.company = "";
    state.kind = "";
    state.sort = "date-desc";
    el.q.value = "";
    el.company.value = "";
    el.sort.value = "date-desc";
    setKind("");
  });

  function matches(entry) {
    if (state.company && entry.company !== state.company) return false;
    if (state.kind && entry.kind !== state.kind) return false;
    if (!state.q) return true;
    var q = state.q.toLowerCase();
    var hay = [
      entry.company, entry.title, entry.kind, entry.date,
      entry.completeness || "", entry.impact || "", entry.root || "",
      (entry.analysisHtml || "").replace(/<[^>]+>/g, " ")
    ].join("\n").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function sortEntries(arr) {
    var copy = arr.slice();
    if (state.sort === "date-desc") {
      copy.sort(function (a, b) {
        if (a.dateUnknown !== b.dateUnknown) return a.dateUnknown ? 1 : -1;
        if (a.dateSort !== b.dateSort) return a.dateSort < b.dateSort ? 1 : -1;
        return a.company.localeCompare(b.company, "zh");
      });
    } else if (state.sort === "date-asc") {
      copy.sort(function (a, b) {
        if (a.dateUnknown !== b.dateUnknown) return a.dateUnknown ? 1 : -1;
        if (a.dateSort !== b.dateSort) return a.dateSort > b.dateSort ? 1 : -1;
        return a.company.localeCompare(b.company, "zh");
      });
    } else if (state.sort === "company") {
      copy.sort(function (a, b) {
        var c = a.company.localeCompare(b.company, "zh");
        if (c) return c;
        return a.dateSort < b.dateSort ? 1 : -1;
      });
    } else if (state.sort === "title") {
      copy.sort(function (a, b) { return a.title.localeCompare(b.title, "zh"); });
    }
    return copy;
  }

  function kindClass(kind) {
    return kind === "技术个案" ? "badge-kind-case" : "badge-kind-incident";
  }

  function render() {
    var filtered = sortEntries(ENTRIES.filter(matches));
    el.shown.textContent = String(filtered.length);
    var hints = [];
    if (state.q) hints.push("关键词「" + state.q + "」");
    if (state.company) hints.push("公司 " + state.company);
    if (state.kind) hints.push(state.kind);
    el.hint.textContent = hints.length ? "· 当前筛选：" + hints.join(" / ") : "";

    el.list.innerHTML = "";
    if (!filtered.length) {
      el.empty.hidden = false;
      return;
    }
    el.empty.hidden = true;
    var frag = document.createDocumentFragment();
    filtered.forEach(function (entry) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.setAttribute("data-id", entry.id);
      var dateBadge = entry.dateUnknown
        ? '<span class="badge badge-warn">' + escapeHtml(entry.date) + '</span>'
        : '<span class="badge-date">' + escapeHtml(entry.date) + '</span>';
      var excerpt = entry.impact || entry.root || "";
      btn.innerHTML =
        '<div class="card-top">' +
          '<span class="badge ' + kindClass(entry.kind) + '">' + escapeHtml(entry.kind) + '</span>' +
          '<span class="badge badge-company">' + escapeHtml(entry.company) + '</span>' +
          dateBadge +
        '</div>' +
        '<h2>' + escapeHtml(entry.title) + '</h2>' +
        (excerpt ? '<p class="excerpt">' + escapeHtml(excerpt) + '</p>' : '') +
        '<div class="card-foot">' +
          '<span class="meta-item">原文完整度：' + escapeHtml(entry.completeness || "—") + '</span>' +
          '<span class="meta-item">v2 分析已填</span>' +
        '</div>';
      btn.addEventListener("click", function () { openDetail(entry.id); });
      frag.appendChild(btn);
    });
    el.list.appendChild(frag);
  }

  function openDetail(id) {
    var entry = ENTRIES.find(function (e) { return e.id === id; });
    if (!entry) return;
    state.openId = id;
    el.drawerTitle.textContent = entry.title;
    el.drawerSub.innerHTML =
      '<span class="badge ' + kindClass(entry.kind) + '">' + escapeHtml(entry.kind) + '</span>' +
      '<span class="badge badge-company">' + escapeHtml(entry.company) + '</span>' +
      (entry.dateUnknown
        ? '<span class="badge badge-warn">' + escapeHtml(entry.date) + '</span>'
        : '<span class="badge badge-company">' + escapeHtml(entry.date) + '</span>') +
      '<span class="badge badge-company">完整度 ' + escapeHtml(entry.completeness || "—") + '</span>';
    el.drawerSource.href = entry.url;
    el.drawerSource.style.display = entry.url ? "inline-flex" : "none";

    var body = "";
    body += '<div class="links-row">';
    if (entry.url) {
      body += '<a class="btn btn-primary" href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener noreferrer">查看原文</a>';
    } else {
      body += '<span class="badge badge-warn">原文链接未收录</span>';
    }
    body += '</div>';
    body += '<div class="summary-grid">';
    body += '<div class="summary-box"><div class="section-label">影响摘要</div><p>' + escapeHtml(entry.impact || "报告未抽出摘要") + '</p></div>';
    body += '<div class="summary-box"><div class="section-label">根因要点</div><p>' + escapeHtml(entry.root || "报告未抽出摘要") + '</p></div>';
    body += '</div>';
    body += '<div class="analysis-body">';
    body += '<div class="section-label">完整 v2 分析</div>';
    body += entry.analysisHtml || '<p>暂无分析正文。</p>';
    body += '</div>';

    el.drawerBody.innerHTML = body;
    el.overlay.hidden = false;
    el.overlay.classList.add("open");
    el.drawer.classList.add("open");
    el.drawer.setAttribute("aria-hidden", "false");
    el.closeDrawer.focus();
    document.body.style.overflow = "hidden";
  }

  function closeDetail() {
    state.openId = null;
    el.overlay.classList.remove("open");
    el.drawer.classList.remove("open");
    el.drawer.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    setTimeout(function () { el.overlay.hidden = true; }, 200);
  }

  el.closeDrawer.addEventListener("click", closeDetail);
  el.overlay.addEventListener("click", closeDetail);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.openId) closeDetail();
  });

  var params = new URLSearchParams(location.search);
  var deep = params.get("id");
  render();
  if (deep) openDetail(deep);
})();
</script>
</body>
</html>
